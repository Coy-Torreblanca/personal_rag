[project]
name = "workers"
version = "0.1.0"
description = "Background job processing for the 30ai platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.3",
    "modal>=1.5.0",
    "database",
    "s3",
    "logutil",
    "langchain-text-splitters>=1.1.2",
    "requests>=2.34.2",
    "openai>=2.48.0",
    "sqlmodel>=0.0.39",
    "cohere>=7.0.8",
]

[tool.uv.sources]
database = { path = "../../packages/database"}
s3 = { path = "../../packages/s3"}
logutil = { path = "../../packages/logutil"}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

