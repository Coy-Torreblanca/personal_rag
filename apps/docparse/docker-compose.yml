version: '3.8'

services:
  docparse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docparse
    ports:
      - "8001:8001"
    environment:
      - DOCPARSE_PROVIDER=docling
      - LOG_LEVEL=INFO
    volumes:
      # Mount a directory for document access
      - ./documents:/documents:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reload
  docparse-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: docparse-dev
    ports:
      - "8001:8001"
    environment:
      - DOCPARSE_PROVIDER=docling
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - ./documents:/documents:ro
    profiles:
      - dev
