[project]
name = "database"
version = "0.1.0"
description = "Database models and utilities for 30ai"
authors = [
    {name = "30ai Team", email = "team@30ai.com"},
]
dependencies = [
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pgvector>=0.4.2",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
