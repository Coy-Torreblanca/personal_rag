# ============================================================
# Base compose file — shared by ALL environments.
#
#   Dev:  podman-compose up -d --build
#         (docker-compose.override.yml is auto-loaded)
#
#   Prod: podman-compose --env-file .env.prod \
#           -f docker-compose.yml -f docker-compose.prod.yml \
#           up -d --build
# ============================================================

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: 30ai-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-30ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-30ai_password}
      POSTGRES_DB: ${DB_NAME:-30ai_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-30ai_user} -d ${DB_NAME:-30ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 30ai-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: 30ai-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 30ai-network

  workers:
    build:
      context: .
      dockerfile: ./apps/workers/Dockerfile
    container_name: 30ai-workers
    environment:
      DATABASE_URL: postgresql://${DB_USER:-30ai_user}:${DB_PASSWORD:-30ai_password}@postgres:5432/${DB_NAME:-30ai_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_S3_API: ${R2_S3_API}
      R2_TOKEN_VALUE: ${R2_TOKEN_VALUE}
      R2_ACCESS_ID: ${R2_ACCESS_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.main.celery inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 30ai-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: 30ai-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-30ai_user}:${DB_PASSWORD:-30ai_password}@postgres:5432/${DB_NAME:-30ai_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_S3_API: ${R2_S3_API}
      R2_TOKEN_VALUE: ${R2_TOKEN_VALUE}
      R2_ACCESS_ID: ${R2_ACCESS_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 30ai-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: 30ai-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_ENVIRONMENT: production
      NEXT_PUBLIC_ORGANIZATION_ID: ${NEXT_PUBLIC_ORGANIZATION_ID:-70885aed-0503-4656-bb72-368a26758575}
      NEXT_PUBLIC_USER_ID: ${NEXT_PUBLIC_USER_ID:-c06ed70c-b7bd-45a4-d0d7-0a978d44d956}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - 30ai-network

volumes:
  redis_data:
  postgres_data:

networks:
  30ai-network:
    driver: bridge
