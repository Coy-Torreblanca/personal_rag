[project]
name = "30ai-workers"
version = "0.1.0"
description = "Celery workers for 30ai platform"
authors = [
    {name = "30ai Team", email = "team@30ai.com"},
]
dependencies = [
    "celery>=5.3.0",
    "redis>=5.0.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.0",
    "litellm>=1.0.0",
    "unstructured>=0.10.0",
    "boto3>=1.28.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
sources = [
    { name = "30ai-database", path = "../../packages/database" },
    { name = "30ai-ai", path = "../../packages/ai" },
    { name = "30ai-config", path = "../../packages/config" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true