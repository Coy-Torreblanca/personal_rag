[project]
name = "30ai-ai"
version = "0.1.0"
description = "AI utilities for 30ai"
authors = [
    {name = "30ai Team", email = "team@30ai.com"},
]
dependencies = [
    "litellm>=1.0.0",
    "unstructured>=0.10.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"