# ============================================================
# Production overrides — loaded explicitly, never with the dev
# override file:
#
#   podman-compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     up -d --build
# ============================================================

services:
  postgres:
    restart: unless-stopped

  # Hourly pg_dump to R2. Prod-only so dev data never lands in the
  # backup prefix. Restore with:
  #   podman exec -it 30ai-postgres-backup-cron restore_backup.sh latest
  postgres-backup:
    build:
      context: .
      dockerfile: ./packages/database/backup/Dockerfile
    container_name: 30ai-postgres-backup-cron
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DB_USER:-30ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-30ai_password}
      POSTGRES_DB: ${DB_NAME:-30ai_db}
      BACKUP_PREFIX: ${POSTGRES_BACKUP_PREFIX:-backups/postgres}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
      ACCESS_KEY: ${R2_ACCESS_ID}
      SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      ACCOUNT_ID: ${R2_ACCOUNT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 30ai-network
    restart: unless-stopped

  redis:
    restart: unless-stopped

  workers:
    restart: unless-stopped

  api:
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required in .env.prod}
        NEXT_PUBLIC_ENVIRONMENT: production
        NEXT_PUBLIC_ORGANIZATION_ID: ${NEXT_PUBLIC_ORGANIZATION_ID:-70885aed-0503-4656-bb72-368a26758575}
        NEXT_PUBLIC_USER_ID: ${NEXT_PUBLIC_USER_ID:-c06ed70c-b7bd-45a4-d0d7-0a978d44d956}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required in .env.prod}
      NEXT_PUBLIC_ENVIRONMENT: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in .env.prod}
    restart: unless-stopped

